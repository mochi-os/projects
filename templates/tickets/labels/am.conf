option.status.todo = የሚሰራ
option.status.done = ተከናውኗል

# Priority options
option.priority.low = ዝቅተኛ
option.priority.medium = መካከለኛ
option.priority.high = ከፍተኛ

# Category options
option.category.bug = ስህተት
option.category.feature = ባህሪ
option.category.question = ጥያቄ
option.category.support = ድጋፍ

# Views
view.tickets = ቲኬቶች
view.list = ዝርዝር
