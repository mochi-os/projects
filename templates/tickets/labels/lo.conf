[labels]

# Template metadata (shown in the "Create project" picker)
template_name = ລະບົບປີ້
template_description = ການພັດທະນາ, ການສະໜັບສະໜຸນ, ແລະ ການຕິດຕາມ Bug

# Object classes (id stays English in the DB; only the name is translated)
class.ticket = ປີ້
class.task = ວຽກ

# Fields (reused across classes — same key, same translation)
field.title = ຊື່ເລື່ອງ
field.description = ລາຍລະອຽດ
field.status = ສະຖານະ
field.priority = ບູລິມະສິດ
field.category = ໝວດໝູ່
field.owner = ເຈົ້າຂອງ
field.due = ກຳນົດສົ່ງ

# Status options (ticket: open/progress/resolved/closed; task reuses todo/progress/done)
option.status.open = ເປີດ
option.status.progress = ກຳລັງດຳເນີນ
option.status.resolved = ແກ້ໄຂແລ້ວ
option.status.closed = ປິດ
option.status.todo = ຕ້ອງເຮັດ
option.status.done = ສຳເລັດ

# Priority options
option.priority.low = ຕ່ຳ
option.priority.medium = ປານກາງ
option.priority.high = ສູງ

# Category options
option.category.bug = Bug
option.category.feature = ຄຸນສົມບັດ
option.category.question = ຄຳຖາມ
option.category.support = ການສະໜັບສະໜຸນ

# Views
view.tickets = ປີ້
view.list = ລາຍການ
